apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: go-db-app
  namespace: monitoring
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: stock-sell-inference
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: http
      path: /metrics
      interval: 15s