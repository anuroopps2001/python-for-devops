apiVersion: apps/v1
kind: Deployment
metadata:
  name:  stock-sell-inference
spec:
  selector:
    matchLabels:
      app: stock-sell-inference
  replicas: 1
  template:
    metadata:
      labels:
        app:  stock-sell-inference
    spec:
      # initContainers:
        # Init containers are exactly like regular containers, except:
          # - Init containers always run to completion.
          # - Each init container must complete successfully before the next one starts.
      containers:
      - name:  inference
        image:  stock-sell-inference:1.0
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 100m
            memory: 100Mi